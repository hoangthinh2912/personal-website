<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo — Quản lý công việc</title>
<style>
  :root{
    --bg:#ffffff; --bg-alt:#f7f7f8; --text:#1a1a1a; --text-muted:#6b6b70;
    --border:#e5e5e8; --accent:#2b2b2e; --accent-soft:#eeeeef; --danger:#dc2626;
    --done:#9a9aa2;
  }
  html[data-theme="dark"]{
    --bg:#15151a; --bg-alt:#1d1d23; --text:#eaeaee; --text-muted:#9a9aa2;
    --border:#2c2c34; --accent:#eaeaee; --accent-soft:#2a2a32; --done:#5c5c66;
  }
  html[data-theme="dark"] .btn-primary{color:#15151a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); background:var(--bg); line-height:1.5; min-height:100vh;
    transition:background .2s, color .2s;
  }
  .wrap{max-width:520px; margin:0 auto; padding:48px 20px 80px}

  .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:32px}
  .top h1{font-size:24px; font-weight:800; letter-spacing:-.02em}
  .theme-toggle{
    width:36px; height:36px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg-alt); color:var(--text); cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }

  .add-row{display:flex; gap:8px; margin-bottom:20px}
  #task-input{
    flex:1; padding:13px 16px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg-alt); color:var(--text); font-size:14.5px; font-family:inherit; outline:none;
  }
  #task-input:focus{border-color:var(--text)}
  .btn{
    padding:13px 20px; border-radius:10px; border:none; cursor:pointer;
    font-size:14.5px; font-weight:700; font-family:inherit;
  }
  .btn-primary{background:var(--accent); color:#fff}

  .filters{display:flex; gap:8px; margin-bottom:20px}
  .filter-btn{
    padding:8px 16px; border-radius:999px; border:1px solid var(--border);
    background:transparent; color:var(--text-muted); font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  .filter-btn.active{background:var(--accent); color:#fff; border-color:var(--accent)}
  html[data-theme="dark"] .filter-btn.active{color:#15151a}

  .list{list-style:none; display:flex; flex-direction:column; gap:8px; min-height:60px}
  .task{
    display:flex; align-items:center; gap:12px; padding:14px 16px;
    border:1px solid var(--border); border-radius:12px; background:var(--bg-alt);
  }
  .task .check{
    width:20px; height:20px; border-radius:6px; border:2px solid var(--border);
    flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center;
    background:var(--bg); font-size:12px; color:#fff;
  }
  .task.done .check{background:var(--accent); border-color:var(--accent)}
  .task .text{flex:1; font-size:14.5px; word-break:break-word}
  .task.done .text{text-decoration:line-through; color:var(--done)}
  .task .del{
    background:none; border:none; color:var(--text-muted); cursor:pointer;
    font-size:16px; padding:4px 8px; border-radius:6px; flex-shrink:0;
  }
  .task .del:hover{color:var(--danger); background:var(--bg)}

  .empty{text-align:center; color:var(--text-muted); font-size:14px; padding:40px 0}

  .footer-bar{
    display:flex; align-items:center; justify-content:space-between; margin-top:20px;
    padding-top:16px; border-top:1px solid var(--border); font-size:13px; color:var(--text-muted);
  }
  .clear-btn{background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:13px; font-family:inherit}
  .clear-btn:hover{color:var(--danger)}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1>✅ Todo của tôi</h1>
    <button class="theme-toggle" id="theme-toggle" title="Đổi giao diện sáng/tối">🌙</button>
  </div>

  <div class="add-row">
    <input id="task-input" type="text" placeholder="Thêm công việc mới..." maxlength="200">
    <button class="btn btn-primary" id="add-btn">Thêm</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">Tất cả</button>
    <button class="filter-btn" data-filter="active">Đang làm</button>
    <button class="filter-btn" data-filter="done">Hoàn thành</button>
  </div>

  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" style="display:none">Chưa có công việc nào. Thêm việc đầu tiên ở trên nhé.</div>

  <div class="footer-bar">
    <span id="count">0 việc còn lại</span>
    <button class="clear-btn" id="clear-done">Xoá mục đã hoàn thành</button>
  </div>
</div>

<script>
  // Dark/Light mode
  const root = document.documentElement;
  const themeToggle = document.getElementById('theme-toggle');
  const savedTheme = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
    root.setAttribute('data-theme', 'dark');
    themeToggle.textContent = '☀️';
  }
  themeToggle.addEventListener('click', () => {
    const isDark = root.getAttribute('data-theme') === 'dark';
    root.toggleAttribute('data-theme', !isDark);
    if (!isDark) root.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
    themeToggle.textContent = isDark ? '🌙' : '☀️';
  });

  // Todo state — giờ lấy/lưu qua API thật (server + SQLite), không còn localStorage nữa
  let tasks = [];
  let filter = 'all';

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const inputEl = document.getElementById('task-input');

  async function loadTasks() {
    const res = await fetch('/api/tasks');
    tasks = await res.json();
    render();
  }

  function render() {
    const filtered = tasks.filter(t =>
      filter === 'all' ? true : filter === 'active' ? !t.done : t.done
    );

    listEl.innerHTML = '';
    filtered.forEach(t => {
      const li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '');
      li.innerHTML = `
        <button class="check">${t.done ? '✓' : ''}</button>
        <span class="text"></span>
        <button class="del">✕</button>
      `;
      li.querySelector('.text').textContent = t.text;
      li.querySelector('.check').addEventListener('click', () => toggleTask(t.id));
      li.querySelector('.del').addEventListener('click', () => deleteTask(t.id));
      listEl.appendChild(li);
    });

    emptyEl.style.display = filtered.length === 0 ? 'block' : 'none';
    const remaining = tasks.filter(t => !t.done).length;
    countEl.textContent = `${remaining} việc còn lại`;
  }

  async function addTask() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    const res = await fetch('/api/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const newTask = await res.json();
    tasks.push(newTask);
    render();
  }

  async function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    const done = !t.done;
    await fetch(`/api/tasks/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ done })
    });
    t.done = done;
    render();
  }

  async function deleteTask(id) {
    await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
    tasks = tasks.filter(t => t.id !== id);
    render();
  }

  document.getElementById('add-btn').addEventListener('click', addTask);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  document.getElementById('clear-done').addEventListener('click', async () => {
    await fetch('/api/tasks', { method: 'DELETE' });
    tasks = tasks.filter(t => !t.done);
    render();
  });

  loadTasks();
</script>

</body>
</html>
